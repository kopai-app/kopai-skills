name: Publish skills to Tessl

# Publishes each portable skill in tessl/skills.json as its own Tessl
# package, kopai/<skill>, at the skill's metadata.version. Versions Tessl
# already has are skipped; CI makes sure a changed skill was bumped.

permissions:
  # id-token: Tessl signs the publish with the job's OIDC token (verified
  # provenance); without it a publish goes out unverified.
  id-token: write
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "plugins/kopai/skills/**"
      - "plugins/kopai/claude-skills/**"
      - "tessl/**"
      - "scripts/tessl-stage.mjs"
      - "scripts/lib/**"
  workflow_dispatch:

concurrency:
  group: publish-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "skills=$(node scripts/tessl-stage.mjs --list)" >> "$GITHUB_OUTPUT"

  publish:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.list.outputs.skills) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_API_TOKEN }}
      - name: Stage the package
        run: node scripts/tessl-stage.mjs "${{ matrix.skill }}" "$RUNNER_TEMP/pkg"
      # tessl plugin info exits 1 for every failure, so read the message:
      # only "no such version" or "no such plugin" means publish. Anything
      # else (no token, network) fails here instead of carrying on.
      - name: Check whether this version is already published
        id: published
        working-directory: ${{ runner.temp }}/pkg
        run: |
          if [ -z "${TESSL_TOKEN:-}" ]; then
            echo "::error::TESSL_API_TOKEN is not set for this repository"
            exit 1
          fi
          tile="$(jq -r '"\(.name)@\(.version)"' .tessl-plugin/plugin.json)"
          if out="$(tessl plugin info "$tile" --json 2>&1)"; then
            echo "$tile is already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif grep -qE 'has no version|Could not find plugin' <<< "$out"; then
            echo "$tile is not published yet"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            echo "::error::Could not check whether $tile is published"
            exit 1
          fi
      # A public version with a critical finding is blocked for good and its
      # version number can't be reused, so scan first (security scans are
      # free). The registry scans again after upload, and may still differ.
      - name: Security scan
        if: steps.published.outputs.skip == 'false'
        working-directory: ${{ runner.temp }}/pkg
        run: tessl review run security --workspace kopai --fail-on critical "skills/${{ matrix.skill }}"
      - name: Review skill
        if: steps.published.outputs.skip == 'false'
        working-directory: ${{ runner.temp }}/pkg
        # The package holds the skill under skills/<skill>/, not at its root.
        run: tessl review run quality --workspace kopai --threshold 50 "skills/${{ matrix.skill }}"
      - name: Publish
        if: steps.published.outputs.skip == 'false'
        working-directory: ${{ runner.temp }}/pkg
        run: tessl plugin publish .
